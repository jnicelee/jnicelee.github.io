<html lang="en">
<head>

  <style>
    :root {
      color-scheme: light;
      --ink: #1f2933;
      --muted: #5d6b78;
      --line: #d8dee6;
      --panel: #f6f8fb;
      --accent: #0f766e;
    }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: #ffffff;
    }
    * {
      box-shadow: none;
      text-shadow: none;
      filter: none;
    }
    header {
      padding: 28px 32px 18px;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0;
    }
    main {
      padding: 20px 32px 36px;
    }
    .controls {
      display: grid;
      grid-template-columns: 2fr repeat(3, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 14px;
      background: #ffffff;
    }
    .summary {
      color: var(--muted);
      margin: 0;
    }
    .count {
      margin: 14px 0;
      font-weight: 700;
    }
    .record {
      border-top: 1px solid var(--line);
      padding: 16px 0;
    }
    .record h2 {
      margin: 0 0 6px;
      font-size: 18px;
      letter-spacing: 0;
    }
    .meta, .tags {
      color: var(--muted);
      font-size: 13px;
      margin: 5px 0;
    }
    .tag {
      display: inline-block;
      padding: 2px 7px;
      margin: 2px 4px 2px 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #ffffff;
      color: var(--ink);
      cursor: help;
    }
    .case-details {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .case-details h3 {
      margin: 0 0 4px;
      font-size: 17px;
      letter-spacing: 0;
    }
    .case-kicker {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
    }
    .party-line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      margin: 10px 0 14px;
    }
    .party-label, .case-meta-label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    .party-name {
      color: #111827;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }
    .versus {
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .case-meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 18px;
      margin: 6px 0 14px;
    }
    .case-meta-value {
      color: var(--ink);
      font-weight: 700;
      margin-top: 2px;
    }
    .case-section {
      margin-top: 14px;
    }
    .case-section h4 {
      margin: 0 0 4px;
      font-size: 15px;
      letter-spacing: 0;
    }
    .case-section p {
      margin: 0;
      line-height: 1.55;
    }
    .source-pill {
      display: inline-block;
      margin: 3px 8px 3px 0;
      font-size: 12px;
    }
    .source-pill-label {
      color: var(--muted);
      margin-right: 3px;
    }
    a {
      color: var(--accent);
      font-weight: 700;
    }
    @media (max-width: 820px) {
      header, main {
        padding-left: 18px;
        padding-right: 18px;
      }
      .controls {
        grid-template-columns: 1fr;
      }
      .party-line, .case-meta-grid {
        grid-template-columns: 1fr;
      }
      .versus {
        display: none;
      }
    }
  </style>
</head>

on 2026-05-29 by Commerce Department, National Institute of Standards and Technology. The National Institute of Standards and Technology (NIST), an agency of the United States Department of Commerce, previously announced the formation of the Artificial Intelligence Safety Institute Consortium (\"AISIC\") through a publication dated November 2, 2023 (88 FR 75276). AISIC brought together more than 280 organizations to develop science-based and empirically backed guidelines and standards for artificial intelligence (AI) measurement, laying a foundation for global AI metrology. Through this succeeding notice, NIST is announcing the retitling of AISIC as the NIST Artificial Intelligence Consortium (\"Consortium\"), revising the scope of the Consortium's research, and reissuing its invitation to organizations to submit letters of interest in order to collaborate with NIST, non-profit organizations, industry leaders, universities, and other agencies of the Federal Government in addressing the challenges associated with the development and deployment of AI-based innovations. In support of NIST's directives under the National Artificial Intelligence Initiative Act of 2020 (Pub. L. 116-283), in accordance with Executive Order 14179 issued January 23, 2025 (Removing Barriers to American Leadership in Artificial Intelligence), and as mandated by America's AI Action Plan, issued July 2025, NIST will utilize the Consortium to empower the collaborative establishment of a new measurement science that will enable the identification of proven, scalable, and interoperable techniques and metrics to promote the development and use of AI. Interested organizations should describe the technical expertise and products, data, and/or models that they will bring to the Consortium to support the Consortium's collaborative research activities. Participation in the Consortium is open to all interested organizations that can contribute their expertise, products, data, and/or models to the Consortium activities. Selected participants will be required to enter into a Consortium Cooperative Research and Development Agreement (CRADA) with NIST. At NIST's discretion, entities that are not legally permitted to enter into CRADAs pursuant to law may be allowed to participate in the Consortium under a separate non-CRADA agreement. Organizations that are already members of the Consortium (\"Consortium Members\") are not required to reapply to NIST but may be asked to sign amendments to their current agreements with NIST that reflect the refocused direction of the Consortium. This record belongs in the database because it is an official federal source that discusses artificial intelligence, automation, algorithms, or governance obligations.", "source_url": "https://www.federalregister.gov/documents/2026/05/29/2026-10779/nist-artificial-intelligence-consortium", "citation": "2026-10779 (Notice)", "raw_text": "products, data, and/or models to enable innovation, standardization, and interoperability within AI systems. The full project can be viewed at: https://www.nist.gov/ artificial-intelligence / artificial-intelligence -consortium. Interested parties can submit a letter of interest by visiting the project website at https://www.nist.gov/ artificial-intelligence / artificial-intelligence -consortium/LOI and completing the letter of interest webform; alternatively, parties can answer the questions detailed in LETTER OF INTEREST, below, and send via", "legal_issue_tags": "privacy|risk_management|federal_governance", "ai_system_tags": "ai_governance_framework", "sector_tags": "government|technology", "classification_confidence": "source_api", "created_at": "2026-06-12 20:31:33", "why_this_matters_for_ai": "This federal notice raises a practical AI governance issue about privacy, risk_management, federal_governance in connection with ai_governance_framework. It affects government, technology, as well as lawyers, compliance teams, public officials, journalists, and researchers tracking how AI systems are built, sold, or used. If NIST Artificial Intelligence Consortium becomes influential, organizations may need stronger documentation, clearer user disclosures, better risk controls, and more careful review before deploying similar AI systems. The record is especially useful because it ties an abstract AI policy question to a dated action by Commerce Department, National Institute of Standards and Technology in Federal.", "policy_significance": "Shows how Federal institutions are treating privacy, risk_management, federal_governance as an AI governance concern.", "compliance_implications": "Organizations using similar systems should review documentation, disclosures, oversight, and risk controls.", "affected_stakeholders": "government, technology", "open_questions": "How far will this approach extend to similar AI systems, vendors, and deployment contexts?", "what_to_watch_next": "Watch for follow-on guidance, litigation, enforcement activity, amendments, or implementation deadlines.", "plaintiff": "", "defendant": "", "docket_number": "", "facts_of_case": "", "procedural_history": "", "case_legal_issues": "", "decision_holding": "", "case_litigation_type": "", "case_primary_source_label": "", "case_primary_source_url": "", "case_secondary_source_label": "", "case_secondary_source_url": "", "case_next_steps": "", "legal_issue_tag_entities": "federal_governance, privacy, risk_management", "ai_system_tag_entities": "ai_governance_framework", "sector_tag_entities": "government, technology"}, {"id": 54, "title": "Proposal Review Panel for Physics; Committee Renewal", "source_type": "federal_notice", "jurisdiction": "Federal", "court_or_agency": "National Science Foundation", "date_issued": "2026-05-29", "status": "published", "summary": "Federal Register notice published on 2026-05-29 by National Science Foundation. The National Science Foundation (NSF) is renewing the committee for Proposal Review Panel for Physics. This record belongs in nt or final trade and security agreement concluded between the United States and a foreign trading partner that involve the national emergency declared in Executive Order 14257 of April 2, 2025 (Regulating Imports with a Reciprocal Tariff to Rectify Trade Practices that Contribute to Large and Persistent Annual United States Goods Trade Deficits), or threats to the national security found pursuant to Section 232 of the Trade Expansion Act of 1962 (Section 232). On January 15, 2026, the American Institute in Taiwan (AIT) and the Taipei Economic and Cultural Representative Office in the United States (TECRO) signed the Memorandum of Understanding Between the Taipei Economic and Cultural Representative Office in the United States and the American Institute in Taiwan Relating to Taiwan-U.S. Investment (MOU). In the MOU, the United States committed to, among other things, modify tariffs imposed under Section 232 in certain respects. On February 12, 2026, AIT and TECRO signed the Agreement Between the American Institute in Taiwan and the Taipei Economic and Cultural Representative Office in the United States on Reciprocal Trade Between the United States of America and Taiwan (ART or Agreement). Both the MOU and the ART qualify for implementation under Executive Order 14346. The Secretary and Trade Representative are taking necessary and appropriate action to implement the MOU at this time. The Secretary and Trade Representative are not implementing the ART at this time as it has not yet entered into force. This notice amends the Harmonized Tariff Schedule of the United States (HTSUS) to implement the terms of the MOU pertaining to the modification of certain Section 232 tariffs applied to automobile parts, timber, lumber, and wood derivative products of Taiwan. In addition, the MOU states that the United States will remove derivative Section 232 steel, aluminum, and copper tariffs from aircraft components that are products of Taiwan. This record belongs in the database be 6-05-20", "status": "published", "summary": "Federal Register notice published on 2026-05-20 by Commerce Department, National Institute of Standards and Technology. The Hollings Manufacturing Extension Partnership (MEP) at the National Institute of Standards and Technology (NIST) is initiating a competitive pilot program for existing MEP center(s) to accelerate the adoption and commercialization of advanced manufacturing technologies that enhance the competitiveness of the domestic industrial base. This program will target key sectors where MEP center(s) will lead the development and validation of shared technology frameworks to substantially accelerate the acceptance of advanced manufacturing methods or transform fragmented supply chains into a robust ecosystem. These frameworks will provide a foundation for small- and medium-sized manufacturers to establish capabilities for future production needs or reduce barriers to entry into new markets. Two manufacturing technology topics have been identified for this pilot program: (1) additive manufacturing for aerospace components; and (2) a domestic critical minerals supply chain. This NOI is provided to allow potential applicants time to begin developing proposal strategies and establishing collaborations among industry, academic, Federal laboratory, and state/local government partners. This record belongs in the database because it is an official federal source that discusses artificial intelligence, automation, algorithms, or governance obligations.", "source_url": "https://www.federalregister.gov/documents/2026/05/20/2026-10105/mep-pilot-program", "citation": "2026-10105 (Notice)", "raw_text": "and diversify markets, adopt new technologies, strengthen workforce strategies, and enhance value within supply chains. MEP centers are connected to the MEP National Network TM to learn and share distinctive practices. Transformative technologies such as artificial intelligence , automation, and additive manufacturing are driv gies (QISs); and revisions affecting which enrollees are included in Federal Basic Health Program (BHP) payment calculations to States. This final rule also includes amendments to implement certain provisions of the Working Families Tax Cut (WFTC) legislation. This record belongs in the database because it is an official federal source that discusses artificial intelligence, automation, algorithms, or governance obligations.", "source_url": "https://www.federalregister.gov/documents/2026/05/20/2026-10050/patient-protection-and-affordable-care-act-hhs-notice-of-benefit-and-payment-parameters-for-2027-and", "citation": "2026-10050 (Rule)", "raw_text": "from a notable figure, such as a celebrity or politician, in an advertisement claiming that the figure has endorsed the agent, broker, web-broker, or their agency when that endorsement is not truthful. We stated in the proposed rule that this would include using artificial intelligence -generated videos, such as, but not limited to, deep fakes, or falsely attributing a quote to the public figure. This behavior may lure consumers into clicking on an advertisement or providing their PII based on a false assumption a public figure has endorsed the product", "legal_issue_tags": "privacy|healthcare|risk_management", "ai_system_tags": "ai_governance_framework", "sector_tags": "government|technology", "classification_confidence": "source_api", "created_at": "2026-06-12 20:31:33", "why_this_matters_for_ai": "This federal rule raises a practical AI governance issue about privacy, healthcare, risk_management in connection with ai_governance_framework. It affects government, technology, as well as lawyers, compliance teams, public officials, journalists, and researchers tracking how AI systems are built, sold, or used. If Patient Protection and Affordable Care Act, HHS Notice of Benefit and Payment Parameters for 2027; and Basic Health Program becomes influential, organizations may need stronger documentation, clearer user disclos  amended (the title IV, HEA programs). The final regulations implement statutory changes to the title IV, HEA programs included in the Working Families Tax Cuts Act (WFTCA), signed into law by President Trump on July 4, 2025. In the NPRM, we referenced the WFTCA as the \"One Big Beautiful Bill\"; however, for clarity and consistency in this final rule, we will instead use WFTCA. The WFTCA made numerous changes to the HEA, including changes to student eligibility requirements for the Pell Grant Program and the establishment of Workforce Pell Grants for students who enroll in a new type of eligible program called an \"eligible workforce program,\" intended to be a high-quality, performance-based, short-term program that supports America's workforce needs. This record belongs in the database because it is an official federal source that discusses artificial intelligence, automation, algorithms, or governance obligations.", "source_url": "https://www.federalregister.gov/documents/2026/05/19/2026-10013/accountability-in-higher-education-and-access-through-demand-driven-workforce-pell-pell-grant", "citation": "2026-10013 (Rule)", "raw_text": "on whether the institution offering the eligible workforce program was in good standing with the Department, the geographic location of the institution, if the ineligible organization is the employer for which the program prepares students, the program trains in artificial intelligence , if the program is in a correctional facility, if the program is endorsed by the State board, if the program partners with cohort-based workforce training organizations, and the accrediting agency's support for the program. Several commenters recommended that the", "legal_issue_tags": "employment|education|risk_management", "ai_system_tags": "ai_governance_framework", "sector_tags": "government|education", "classification_confidence": "source_api", "created_at": "2026-06-12 20:31:33", "why_this_matters_for_ai": "This federal rule raises a practical AI       risk_management: "Processes for identifying, measuring, reducing, and monitoring AI-related risks.",
      software: "Records involving software products, developers, platforms, code, or digital services.",
      state_law: "State-level statutes, regulations, or legal duties related to AI.",
      synthetic_media: "AI-generated or AI-altered media, including images, audio, video, voices, or likenesses.",
      technology: "Records involving technology companies, digital tools, platforms, or technical systems.",
      transparency: "Requirements to disclose, explain, label, document, or make AI systems easier to understand.",
      video_interview_ai: "AI used to evaluate, score, or analyze video interviews, often in hiring."
    };

    function displayLabel(value) {
      return (value || "")
        .replace(/[_-]/g, " ")
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .map(word => {
          const lower = word.toLowerCase();
          if (displayAcronyms[lower]) return displayAcronyms[lower];
          if (word.length > 1 && word === word.toUpperCase()) return word;
          return lower.charAt(0).toUpperCase() + lower.slice(1);
        })
        .join(" ");
    }

    function escapeHtml(value) {
      return (value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function tagDefinition(tag) {
      return tagDefinitions[tag] || `${displayLabel(tag)} is a database tag used to group related AI policy records.`;
    }

    function fillSelect(id, values) {
      const select = document.getElementById(id);
      for (const value of values) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = displayLabel(value);
        select.appendChild(option);
      }
    }

    fillSelect("jurisdiction", unique(records.map(record => record.jurisdiction)));
    fillSelect("sourceType", unique(records.map(record => record.source_type)));
    fillSelect("issue", unique(records.flatMap(record => splitTags(record.legal_issue_tag_entities))));

    function matches(record) {
      const query = document.getElementById("search").value.toLowerCase();
      const jurisdiction = document.getElementById("jurisdiction").value;
      const sourceType = document.getElementById("sourceType").value;
      const issue = document.getElementById("issue").value;
      const haystack = fields.map(field => record[field] || "").join(" ").toLowerCase();

      return (!query || haystack.includes(query))
        && (!jurisdiction || record.jurisdiction === jurisdiction)
        && (!sourceType || record.source_type === sourceType)
        && (!issue || splitTags(record.legal_issue_tag_entities).includes(issue));
    }

    function tagHtml(value) {
      return splitTags(value)
        .map(tag => `<span class="tag" title="${escapeHtml(tagDefinition(tag))}">${displayLabel(tag)}</span>`)
        .join(" ") || "Untagged";
    }

    function courtVitalsHtml(record) {
      if (!record.case_litigation_type && !record.plaintiff && !record.defendant && !record.docket_number) {
        return "";
      }
      const sourceLinks = [
        record.case_primary_source_url ? `<span class="source-pill"><span class="source-pill-label">Primary:</span><a href="${record.case_primary_source_url}" target="_blank" rel="noreferrer">${displayLabel(record.case_primary_source_label || "source")}</a></span>` : "",
        record.case_secondary_source_url ? `<span class="source-pill"><span class="source-pill-label">Secondary:</span><a href="${record.case_secondary_source_url}" target="_blank" rel="noreferrer">${displayLabel(record.case_secondary_source_label || "source")}</a></span>` : ""
      ].filter(Boolean).join(" ");
      return `
        <section class="case-details">
          <h3>Case/Litigation Explanation</h3>
          <p class="case-kicker">Parties, docket, procedural posture, legal question, and outcome summary.</p>
          <div class="party-line">
            <div>
              <div class="party-label">Plaintiff</div>
              <div class="party-name">${record.plaintiff || "not specified"}</div>
            </div>
            <div class="versus">v.</div>
            <div>
              <div class="party-label">Defendant</div>
              <div class="party-name">${record.defendant || "not specified"}</div>
            </div>
          </div>
          <div class="case-meta-grid">
            <div>
              <div class="case-meta-label">Docket Number</div>
              <div class="case-meta-value">${record.docket_number || "not specified"}</div>
            </div>
            <div>
              <div class="case-meta-label">Case/Litigation Type</div>
              <div class="case-meta-value">${record.case_litigation_type || "not specified"}</div>
            </div>
          </div>
          <section class="case-section">
            <h4>Facts of the Case</h4>
            <p>${record.facts_of_case || "not specified"}</p>
          </section>
          <section class="case-section">
            <h4>Procedural History</h4>
            <p>${record.procedural_history || "not specified"}</p>
          </section>
          <section class="case-section">
            <h4>Legal Issue(s)</h4>
            <p>${record.case_legal_issues || "not specified"}</p>
          </section>
          <section class="case-section">
            <h4>Decision/Holding</h4>
            <p>${record.decision_holding || "not specified"}</p>
          </section>
          <section class="case-section">
            <h4>What to Watch Next</h4>
            <p>${record.case_next_steps || "not specified"}</p>
          </section>
          ${sourceLinks ? `<section class="case-section"><h4>Sources for this explanation</h4>${sourceLinks}</section>` : ""}
        </section>
      `;
    }

    function render() {
      const filtered = records.filter(matches);
      document.getElementById("count").textContent = `${filtered.length} matching record(s)`;
      document.getElementById("results").innerHTML = filtered.map(record => `
        <article class="record">
          <h2>${record.title}</h2>
          <p class="meta">${record.jurisdiction} | ${displayLabel(record.source_type)} | ${record.date_issued} | ${displayLabel(record.status)}</p>
          <p>${record.summary}</p>
          <p class="meta"><strong>Citation:</strong> ${record.citation}</p>
          <p class="tags"><strong>Issue tags:</strong> ${tagHtml(record.legal_issue_tag_entities)}</p>
          <p class="tags"><strong>AI system tags:</strong> ${tagHtml(record.ai_system_tag_entities)}</p>
          <p class="tags"><strong>Sector tags:</strong> ${tagHtml(record.sector_tag_entities)}</p>
          <a href="${record.source_url}" target="_blank" rel="noreferrer">Open Primary Source</a>
          ${courtVitalsHtml(record)}
        </article>
      `).join("");
    }

    for (const id of ["search", "jurisdiction", "sourceType", "issue"]) {
      document.getElementById(id).addEventListener("input", render);
    }
    render();
  </script>
</body>
</html>
